name: Build custom image

# Builds this branch (evcc 0.316.0 + the schneider-micrologic template) as an
# arm64 image for a Home Assistant Yellow add-on. Runs on a native arm64 runner,
# so there is no cross-build or QEMU step. Bump `tag` on every run: Supervisor
# only re-pulls when the add-on's version string changes.

# Triggered by pushing this branch: workflow_dispatch would require the file to
# live on the fork's default branch, and master is kept identical to upstream.
# Rebuild by bumping IMAGE_TAG below and pushing again.
on:
  push:
    branches: [build/custom-image]

env:
  IMAGE_TAG: 0.316.0-micrologic.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push arm64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        env:
          DOCKER_BUILDKIT: "1"
          IMAGE: ghcr.io/${{ github.repository_owner }}/evcc:${{ env.IMAGE_TAG }}
        run: |
          docker build --build-arg RELEASE=1 --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
